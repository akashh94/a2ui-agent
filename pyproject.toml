[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "a2ui-agent"
version = "0.1.0"
description = "A2UI agent — ADK LlmAgent (google_search + A2UI catalog generation) over A2A on Cloud Run"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a,db,gcp,agent-identity]>=2.6.2",
    "google-cloud-aiplatform[agent_engines,adk]>=1.153.1",
    "google-genai>=2.17.0",
    "a2ui-agent-sdk>=0.5.0",
    # a2ui-agent-sdk pins a2a-sdk<0.4.0; the A2A serving helpers we use
    # (A2AFastAPIApplication) come from that a2a-sdk line.
    "a2a-sdk>=0.3.26,<0.4.0",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "python-dotenv",
]

[project.optional-dependencies]
# Consumed by agents-cli lint-style checks (ruff/format/codespell/ty).
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "PLW", "C4", "SIM"]
ignore = [
    "BLE001",
    "PLW1508",
]
